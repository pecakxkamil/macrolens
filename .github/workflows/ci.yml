name: MacroLens CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHON_DOTENV_DISABLED: "1"
      FRED_API_KEY: ""
      DB_HOST: "invalid.test"
      DB_PORT: "1"
      DB_NAME: "macrolens_test_unused"
      DB_USER: "unused"
      DB_PASSWORD: "unused"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run all backend tests without external services
        run: python -m pytest -q

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run all frontend tests without network access
        env:
          NODE_OPTIONS: --require=../.github/ci/no-network.cjs
        run: npm test
      - name: Type-check and build production frontend
        run: npm run build

  postgres-integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHON_DOTENV_DISABLED: "1"
      FRED_API_KEY: ""
      DB_HOST: "127.0.0.1"
      DB_PORT: "5432"
      DB_NAME: "macrolens_ci_control"
      DB_USER: "macrolens_ci"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: macrolens_ci_control
          POSTGRES_USER: macrolens_ci
          # Disposable job-local service, published only on runner loopback.
          # No real password, repository secret or production volume is used.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U macrolens_ci -d macrolens_ci_control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # Empire tests the actual pre-3C schema using git show.
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Configure required client password without logging it
        run: |
          python - <<'PY'
          import os, secrets
          # libpq/project contract requires a nonempty value; trust auth does
          # not use it. Mask before exporting it to subsequent step environments.
          value = secrets.token_urlsafe(24)
          print("::add-mask::" + value)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write("DB_PASSWORD=" + value + "\n")
          PY
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify historical Empire schema baseline
        run: |
          baseline=0147d6e1fc64d3c5e317f724e8f264fb119760b8
          git cat-file -e "$baseline^{commit}"
          git merge-base --is-ancestor "$baseline" HEAD
          git show "$baseline:app/database/schema.sql" > "$RUNNER_TEMP/pre-empire-schema.sql"
          if grep -q 'publisher_documents' "$RUNNER_TEMP/pre-empire-schema.sql"; then
            echo "Empire baseline must precede publisher documents" >&2
            exit 1
          fi
      - name: PostgreSQL Empire State fresh install and historical upgrade
        run: python tests/postgres_empire_validation.py --baseline 0147d6e1fc64d3c5e317f724e8f264fb119760b8
      - name: PostgreSQL FT900 documents and rollback
        run: python tests/postgres_ft900_validation.py
      - name: PostgreSQL BEA Direct revisions and rollback
        run: python tests/postgres_bea_validation.py
      - name: PostgreSQL BEA release-aware coordination and backoff
        run: python tests/postgres_bea_release_validation.py
